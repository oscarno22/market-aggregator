# Wire formats and per-venue sync strategy. Parses bytes, decides sync actions.
# Still no transport and no tokio: a `VenueSync` is a state machine you feed
# frames to, which is what lets the fake venue drive the identical code path
# that a real socket does.
[package]
name = "ma-venues"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ma-core = { path = "../ma-core" }
crc32fast = "1"
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
# `raw_value` lets Kraken's price/qty fields be captured as their exact
# source text before any numeric interpretation. Without it, serde_json
# parses a bare JSON number through f64, which silently drops the trailing
# zeros Kraken's book checksum depends on — see venues/kraken.rs.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
