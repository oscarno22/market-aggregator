[package]
name = "ma-server"
version = "0.1.0"
# Three binaries live here (serve, record, replay); `cargo run -p ma-server`
# should mean the server.
default-run = "ma-server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Forwarded to ma-persist. Off by default: CLAUDE.md gates AWS behind an IAM
# user scoped to one bucket prefix, so the default build does not link the SDK.
s3 = ["ma-persist/s3", "ma-coord/s3"]

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.33"
ma-coord = { path = "../ma-coord" }
ma-core = { path = "../ma-core" }
ma-persist = { path = "../ma-persist" }
ma-pipeline = { path = "../ma-pipeline" }
ma-venues = { path = "../ma-venues" }
# The gateway is an SSE *client* of every node, so it reads a response as it
# arrives rather than after it finishes — which for a stream that never
# finishes is the whole thing. `Response::chunk` does that on the base API;
# the `stream` feature would add a `futures-io` dependency for a combinator
# this does not need.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3"
