[package]
name = "ma-server"
version = "0.1.0"
# Three binaries live here (serve, record, replay); `cargo run -p ma-server`
# should mean the server.
default-run = "ma-server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.33"
ma-core = { path = "../ma-core" }
ma-pipeline = { path = "../ma-pipeline" }
ma-venues = { path = "../ma-venues" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
