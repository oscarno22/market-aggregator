# Where async begins: ingest tasks, reconnect, channels, aggregator, replay.
[package]
name = "ma-pipeline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ma-core = { path = "../ma-core" }
ma-venues = { path = "../ma-venues" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2"] }
async-compression = { version = "0.4.43", default-features = false, features = ["tokio", "gzip"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
